[package]
name = "arboretum"
version = "0.1.0"
edition = "2024"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:reqwest", "dep:tui-input"]

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
tokio-rusqlite = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "decompression-gzip"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
opentelemetry = "0.27"
opentelemetry-proto = { version = "0.27", features = ["gen-tonic"] }
prost = "0.13"
tonic = "0.12"
hex = "0.4"
base64 = "0.22"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
tui-input = { version = "0.10", optional = true }
rust-embed = "8.11.0"
mime_guess = "2.0.5"
camino = "1.2.2"
data-encoding = "2.10.0"
chrono-tz = "0.10.4"
systemd-connector = "0.1.0"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.49.0", features = ["full"] }
indoc = "2.0"

[build-dependencies]
npm_rs = "1"
